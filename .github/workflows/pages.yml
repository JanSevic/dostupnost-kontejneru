# GitHub Pages: tests the web version, builds the list of published states and publishes web/.
# In the repository: Settings → Pages → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: cd web && node --test tests/*.test.js
      - name: List of published states
        run: cd web && node tools/presets-index.mjs
      - name: Prepare site
        run: |
          rm -rf _site && cp -r web _site
          rm -rf _site/tests _site/tools _site/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
