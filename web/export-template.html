<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>/*__LEAFLET_CSS__*/</style>
<style>
html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; background: #f4f2ee; }
.panel { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.35);
  font-size: 13px; line-height: 1.35; max-width: 300px; }
.panel h1 { font-size: 15px; margin: 0 0 2px; }
.panel .date { color: #555; font-size: 12px; margin-bottom: 6px; }
.panel label { display: block; cursor: pointer; }
.panel hr { border: 0; border-top: 1px solid #ddd; margin: 6px 0; }
.legend-title { font-weight: 600; margin-bottom: 2px; }
.legend-caption { color: #555; font-size: 12px; margin-bottom: 4px; }
.legend-row { display: flex; align-items: center; gap: 6px; }
.legend-line { display: inline-block; width: 22px; height: 5px; border-radius: 2px; }
.legend-gradient { height: 10px; border-radius: 3px; margin: 4px 0 2px; }
.legend-axis { display: flex; justify-content: space-between; font-size: 11px; color: #444; margin-bottom: 4px; }
.container-icon div { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px #333, 0 1px 3px rgba(0,0,0,.4); font: 700 10px/22px system-ui, sans-serif; text-align: center; }
.container-icon.dimmed { opacity: .35; }
.label-wrap { pointer-events: none; }
.label-wrap span { position: absolute; left: 0; top: 0; white-space: nowrap; color: #4b5057;
  font: 600 11px/1 system-ui, sans-serif; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff; }
.label-wrap span.label-place { font-size: 15px; font-weight: 700; color: #2b2f35; }
.label-wrap span.label-hamlet { font-size: 13px; }
</style>
<script>/*__LEAFLET_JS__*/</script>
<script>/*__RENDER_JS__*/</script>
</head>
<body>
<div id="map"></div>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const R = window.Render;
  const map = L.map("map", { preferCanvas: true, maxZoom: 19 });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution(R.escapeHtml(DATA.attribution));
  map.createPane("basemap").style.zIndex = 150;
  const basemap = R.vectorBasemap(L, DATA.basemap, { map, pane: "basemap" }).addTo(map);
  let raster = null;
  if (DATA.tiles) {
    const TRANSPARENT = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
    const Embedded = L.GridLayer.extend({
      createTile: function (c) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = DATA.tiles[c.z + "/" + c.x + "/" + c.y] || TRANSPARENT;
        return img;
      },
    });
    raster = new Embedded({ maxZoom: 19, opacity: 0.9 }).addTo(map);
  }
  const renderer = L.canvas({ padding: 0.3 });
  const types = Object.fromEntries(DATA.types.map(t => [t.key, t]));
  let layer = DATA.layer;
  const lines = DATA.segments.map((c, i) => L.polyline(c.map(p => [p[1], p[0]]), { renderer, weight: 4, opacity: 0.95, idx: i }));
  const group = L.featureGroup(lines).addTo(map);
  group.bindTooltip(l => {
    const d = values()[l.options.idx];
    return R.escapeHtml(layerName(layer)) + ": " + R.formatM(d);
  }, { sticky: true });
  function values() { return layer === DATA.summary_key ? DATA.summary : DATA.results[layer]; }
  function layerName(k) { return k === DATA.summary_key ? "Všechny typy" : (types[k] ? types[k].name : k); }
  const markers = L.layerGroup().addTo(map);
  function redraw() {
    const d = values();
    lines.forEach((c, i) => c.setStyle({ color: R.color(d[i], DATA.settings) }));
    markers.clearLayers();
    DATA.containers.features.forEach(f => {
      const p = f.properties, t = types[p.typ] || { color: "#555", abbr: "?", name: p.typ };
      const dim = layer !== DATA.summary_key && p.typ !== layer;
      const m = L.marker([f.geometry.coordinates[1], f.geometry.coordinates[0]],
        { icon: R.containerIcon(L, t, dim ? "dimmed" : ""), zIndexOffset: dim ? 0 : 1000 });
      m.bindPopup("<b>" + R.escapeHtml(t.name) + "</b> (č. " + p.id + ")" + (p.poznamka ? "<br>" + R.escapeHtml(p.poznamka) : ""));
      m.addTo(markers);
    });
    legend.innerHTML = R.legendHtml(DATA.settings, layerName(layer),
      layer === DATA.summary_key ? "nejdelší z cest k nejbližším kontejnerům jednotlivých typů" : "vzdálenost po pěších cestách k nejbližšímu kontejneru");
  }
  const controls = L.control({ position: "topright" });
  controls.onAdd = function () {
    const div = L.DomUtil.create("div", "panel");
    let h = "<h1>" + R.escapeHtml(DATA.title) + "</h1><div class=\"date\">" + R.escapeHtml(DATA.date) + "</div>";
    DATA.layers.forEach(k => {
      h += "<label><input type=\"radio\" name=\"layer\" value=\"" + k + "\"" + (k === layer ? " checked" : "") + "> " +
        R.escapeHtml(layerName(k)) + "</label>";
    });
    h += "<hr><label><input type=\"checkbox\" id=\"chk-basemap\" checked> vektorový podklad</label>";
    if (raster) h += "<label><input type=\"checkbox\" id=\"chk-raster\" checked> uložené dlaždice</label>";
    div.innerHTML = h;
    L.DomEvent.disableClickPropagation(div);
    div.addEventListener("change", e => {
      if (e.target.name === "layer") { layer = e.target.value; redraw(); }
      if (e.target.id === "chk-basemap") e.target.checked ? basemap.addTo(map) : map.removeLayer(basemap);
      if (e.target.id === "chk-raster") e.target.checked ? raster.addTo(map) : map.removeLayer(raster);
    });
    return div;
  };
  controls.addTo(map);
  const legendControl = L.control({ position: "bottomright" });
  let legend;
  legendControl.onAdd = function () { legend = L.DomUtil.create("div", "panel"); return legend; };
  legendControl.addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
  const outline = L.polygon(DATA.area.map(p => [p[1], p[0]]), { color: "#333", weight: 1, dashArray: "4 4", fill: false, interactive: false }).addTo(map);
  map.fitBounds(DATA.extent ? [[DATA.extent[1], DATA.extent[0]], [DATA.extent[3], DATA.extent[2]]] : outline.getBounds());
  redraw();
})();
</script>
</body>
</html>
