<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Recyklace</title>
  <rect width="64" height="64" rx="14" fill="#1a9850"/>
  <!-- three chasing arrows around an equilateral triangle centred at (32, 34); shifted to centre the drawing -->
  <g transform="translate(0 4.25)" fill="#fff" stroke="#fff">
    <g id="arrow">
      <path d="M23.34 24 L32 9 L37.2 18" fill="none" stroke-width="7" stroke-linejoin="round" stroke-linecap="butt"/>
      <path d="M41.09 24.75 L43.26 14.5 L31.14 21.5 Z" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <use href="#arrow" transform="rotate(120 32 34)"/>
    <use href="#arrow" transform="rotate(240 32 34)"/>
  </g>
</svg>
